<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Delivery DApp</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Safe Delivery Decentralized Application</h1>
    <button onclick="connectWallet()">Connect Wallet</button>
    <p id="walletAddress">Not connected</p>
</header>


    <main>
        <section id="manufacturer">
            <h2>Manufacturer</h2>
            <form id="createContractForm">
                <label for="retailerAddress">Retailer Address:</label>
                <input type="text" id="retailerAddress" placeholder="Enter retailer address">

                <label for="courierAddress">Courier Address:</label>
                <input type="text" id="courierAddress" placeholder="Enter courier address">

                <button type="button" onclick="createContract()">Create Contract</button>
            </form>

            <form id="setPricesForm">
                <label for="price">Order Price (in Wei):</label>
                <input type="text" id="price" placeholder="Enter price">

                <label for="shippingFee">Shipping Fee (in Wei):</label>
                <input type="text" id="shippingFee" placeholder="Enter shipping fee">

                <button type="button" onclick="setPrices()">Set Prices</button>
            </form>

            <form id="sendInvoiceForm">
                <label for="deliveryDate">Delivery Date (Unix Timestamp):</label>
                <input type="text" id="deliveryDate" placeholder="Enter delivery date">

                <button type="button" onclick="sendInvoice()">Send Invoice</button>
            </form>
        </section>

        <section id="retailer">
            <h2>Retailer</h2>
            <form id="sendOrderForm">
                <label for="product">Product:</label>
                <input type="text" id="product" placeholder="Enter product name">

                <label for="quantity">Quantity:</label>
                <input type="number" id="quantity" placeholder="Enter quantity">

                <button type="button" onclick="sendOrder()">Send Order</button>
            </form>

            <form id="payOrderForm">
                <label for="paymentValue">Payment Value (in Wei):</label>
                <input type="text" id="paymentValue" placeholder="Enter total payment">

                <button type="button" onclick="payOrder()">Pay Order</button>
            </form>

            <button type="button" onclick="finalizeOrder()">Finalize Order</button>
        </section>

        <section id="courier">
            <h2>Courier</h2>
            <button type="button" onclick="confirmDelivery()">Confirm Delivery</button>
        </section>

        <section id="events">
            <h2>Contract Events</h2>
            <ul id="eventsList">
                <!-- Dynamic event updates will be shown here -->
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Safe Delivery DApp</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/gh/ethereum/web3.js/dist/web3.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
